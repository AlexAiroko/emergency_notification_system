global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "ens-app"
    static_configs:
      - targets: ["app:8000"]
    metrics_path: "/metrics"

  - job_name: rabbitmq
    static_configs:
      - targets:
          - rabbitmq:15692
  
  - job_name: rabbitmq_detailed
    metrics_path: /metrics/detailed
    params:
      family:
        - queue_coarse_metrics
    static_configs:
      - targets:
          - rabbitmq:15692
